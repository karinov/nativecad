<script>
// ── the SAME decoder cad_mesh_payload publishes as a resource, verbatim ──
'use strict';
/**
 * packages/mcp/src/tools/output/meshPayloadDecoder.js — CADSF-397
 *
 * THE INVERSE OF ./meshPayload.js, and the file `cad_mesh_payload`'s consumer
 * actually runs. It is shipped verbatim as the MCP resource
 * `cadsolver://viewer/decode-mesh.js` (read straight off disk — see
 * output/index.js), so the decoder an artifact pastes in and the decoder this
 * package's tests run are THE SAME BYTES. A decoder documented in prose beside
 * an encoder is a decoder that drifts; this one cannot, because
 * test/cadsf-397.test.js round-trips real geometry through this exact file and
 * the resource is `fs.readFileSync(__filename)`.
 *
 * Dual-mode on purpose: plain function declarations, no `require`, no
 * top-level `await`, and the CommonJS export guarded at the bottom. Paste it
 * into a browser <script> / a Claude artifact and `decodeMeshPayload` is
 * simply in scope; `require()` it from Node and you get the same functions.
 *
 * Usage (three.js artifact):
 *
 *     const m = decodeMeshPayload(payload);           // payload = tool result
 *     const g = new THREE.BufferGeometry();
 *     g.setAttribute('position', new THREE.BufferAttribute(m.positions, 3));
 *     if (m.normals) g.setAttribute('normal', new THREE.BufferAttribute(m.normals, 3));
 *     g.setIndex(new THREE.BufferAttribute(m.indices, 1));
 *     scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial()));
 *     camera.up.set(0, 0, 1);                         // payload.upAxis === '+Z'
 *     camera.position.set(...m.camera.position);
 *     camera.lookAt(...m.camera.target);
 *
 * Every buffer is little-endian, which is the only byte order any browser or
 * Node platform this can run on actually uses (typed-array views take the
 * host's order; there is no big-endian target left in practice).
 *
 * CADSF-416 (format cadsolver.mesh/2): `indices` may now be FACE-LOCAL
 * (`indices.local: true`) — decodeIndices() reads `faces[]` to add each
 * face's vertexStart back on. /1 payloads (no `local` key) decode exactly as
 * before; this file reads both.
 *
 * CADSB-294 (format cadsolver.mesh/3): a payload MAY also carry `instances`
 * — positions/normals/indices/faces/edges still decode to exactly ONE body
 * (the prototype of a cad_pattern_copies result); `decoded.instances`, when
 * present, is `[{solidId, translation:[x,y,z], quaternion:[x,y,z,w]}, ...]`,
 * one entry per instance the pattern actually has (draw the SAME decoded
 * geometry once per entry, placed by that entry's translation+quaternion —
 * three.js: `mesh.position.fromArray(t); mesh.quaternion.fromArray(q)` per
 * instance, or one row of an `InstancedMesh`'s matrix per entry). Code that
 * does not read `decoded.instances` still gets one fully correct body.
 */

/** base64 -> Uint8Array. Uses atob in a browser, Buffer in Node. */
function b64ToBytes(b64) {
    if (typeof atob === 'function') {
        const bin = atob(b64);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
    }
    const buf = Buffer.from(b64, 'base64');
    return new Uint8Array(buf.buffer, buf.byteOffset, buf.byteLength);
}

/** Copy into a fresh ArrayBuffer so typed-array views are always aligned. */
function alignedBuffer(bytes) {
    const copy = new Uint8Array(bytes.length);
    copy.set(bytes);
    return copy.buffer;
}

/**
 * Decode a quantized (or float32) position buffer into a Float32Array of
 * x,y,z triples: `p = origin + q * scale`, exactly the affine transform
 * glTF's KHR_mesh_quantization carries on the node.
 */
function decodePositions(block) {
    const bytes = b64ToBytes(block.base64);
    if (block.encoding === 'float32') return new Float32Array(alignedBuffer(bytes));
    const q = block.encoding === 'quantized-uint8'
        ? new Uint8Array(alignedBuffer(bytes))
        : new Uint16Array(alignedBuffer(bytes));
    const out = new Float32Array(q.length);
    const o = block.origin;
    const s = block.scale;
    for (let i = 0; i < q.length; i += 3) {
        out[i] = o[0] + q[i] * s[0];
        out[i + 1] = o[1] + q[i + 1] * s[1];
        out[i + 2] = o[2] + q[i + 2] * s[2];
    }
    return out;
}

/**
 * Octahedral unit-vector decode (Cigolle, Donow, Evangelakos, Mara, McGuire,
 * Meyer — "A Survey of Efficient Representations for Independent Unit
 * Vectors", JCGT 3(2), 2014 — the same scheme glTF's KHR_mesh_quantization
 * and meshoptimizer use for 8-bit normals).
 */
function octDecode(a, b) {
    let x = a / 127;
    let y = b / 127;
    const z = 1 - Math.abs(x) - Math.abs(y);
    if (z < 0) {
        const ox = (1 - Math.abs(y)) * (x >= 0 ? 1 : -1);
        const oy = (1 - Math.abs(x)) * (y >= 0 ? 1 : -1);
        x = ox;
        y = oy;
    }
    const len = Math.sqrt(x * x + y * y + z * z) || 1;
    return [x / len, y / len, z / len];
}

/** Decode a normal buffer into a Float32Array of x,y,z triples. */
function decodeNormals(block) {
    const bytes = b64ToBytes(block.base64);
    if (block.encoding === 'float32') return new Float32Array(alignedBuffer(bytes));
    const oct = new Int8Array(alignedBuffer(bytes));
    const out = new Float32Array((oct.length / 2) * 3);
    for (let i = 0, o = 0; i < oct.length; i += 2, o += 3) {
        const n = octDecode(oct[i], oct[i + 1]);
        out[o] = n[0];
        out[o + 1] = n[1];
        out[o + 2] = n[2];
    }
    return out;
}

/**
 * Decode an index buffer into a Uint32Array (uint8/uint16 buffers are
 * widened). CADSF-416: when `block.local` is true, the raw values are
 * FACE-LOCAL (0-based within each face's own vertex range, see
 * meshPayload.js's encodeIndicesLocal) — this walks `faces[]` and adds each
 * face's `vertexStart` back on to recover ordinary global indices, so every
 * OTHER caller of this function (three.js BufferGeometry.setIndex, a raw
 * WebGL element array, …) sees exactly the same shape it always did,
 * regardless of which payload version produced it.
 */
function decodeIndices(block, faces) {
    const bytes = b64ToBytes(block.base64);
    const raw = block.encoding === 'uint8'
        ? new Uint32Array(new Uint8Array(alignedBuffer(bytes)))
        : block.encoding === 'uint16'
            ? new Uint32Array(new Uint16Array(alignedBuffer(bytes)))
            : new Uint32Array(alignedBuffer(bytes));
    if (!block.local || !faces || !faces.length) return raw;
    const out = new Uint32Array(raw.length);
    for (let f = 0; f < faces.length; f++) {
        const face = faces[f];
        const start = face.triangleStart * 3;
        const end = start + face.triangleCount * 3;
        for (let i = start; i < end; i++) out[i] = raw[i] + face.vertexStart;
    }
    return out;
}

/**
 * CADSB-294: decode an `instances` block into one plain object per instance.
 * `arr` is `count` rows of `stride` (7) float32 values: [tx,ty,tz,qx,qy,qz,qw].
 */
function decodeInstances(block) {
    if (!block) return null;
    const arr = new Float32Array(alignedBuffer(b64ToBytes(block.base64)));
    const stride = block.stride || 7;
    const out = new Array(block.count);
    for (let i = 0; i < block.count; i++) {
        const o = i * stride;
        out[i] = {
            solidId: (block.solidIds && block.solidIds[i]) || null,
            translation: [arr[o], arr[o + 1], arr[o + 2]],
            quaternion: [arr[o + 3], arr[o + 4], arr[o + 5], arr[o + 6]],
        };
    }
    return out;
}

/**
 * Decode the whole payload.
 *
 * @param {object} payload the `mesh` object a `cad_mesh_payload` call returns
 * @returns {{positions: Float32Array, normals: Float32Array|null, indices: Uint32Array,
 *            faces: Array, edges: {positions: Float32Array, offsets: Uint32Array}|null,
 *            instances: {solidId:string, translation:number[], quaternion:number[]}[]|null,
 *            bbox: object, center: number[], radius: number, camera: object,
 *            units: string, upAxis: string}}
 */
function decodeMeshPayload(payload) {
    if (!payload || !payload.positions || !payload.indices) {
        throw new Error('decodeMeshPayload: not a cadsolver mesh payload (no positions/indices)');
    }
    let edges = null;
    if (payload.edges) {
        edges = {
            positions: decodePositions(payload.edges),
            offsets: new Uint32Array(alignedBuffer(b64ToBytes(payload.edges.offsets))),
        };
    }
    return {
        format: payload.format,
        units: payload.units,
        upAxis: payload.upAxis,
        positions: decodePositions(payload.positions),
        normals: payload.normals ? decodeNormals(payload.normals) : null,
        indices: decodeIndices(payload.indices, payload.faces),
        faces: payload.faces || [],
        solidIds: payload.solidIds || [],
        edges,
        instances: payload.instances ? decodeInstances(payload.instances) : null,
        bbox: payload.bbox,
        center: payload.center,
        radius: payload.radius,
        camera: payload.camera,
    };
}

/**
 * Walk `edges` as polylines: `forEachEdgePolyline(decoded.edges, (pts) => …)`
 * where `pts` is a Float32Array view of that one polyline's x,y,z points.
 * (three.js: build a LineSegments/Line per polyline, or concatenate.)
 */
function forEachEdgePolyline(edges, fn) {
    if (!edges) return;
    for (let i = 0; i + 1 < edges.offsets.length; i++) {
        const start = edges.offsets[i] * 3;
        const end = edges.offsets[i + 1] * 3;
        fn(edges.positions.subarray(start, end), i);
    }
}

if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
        decodeMeshPayload, decodePositions, decodeNormals, decodeIndices, decodeInstances,
        octDecode, b64ToBytes, forEachEdgePolyline,
    };
}

addEventListener('keydown', (e) => {
    const i = MODE_ORDER.indexOf(mode);
    if (e.key >= '1' && e.key <= String(MODE_ORDER.length)) setMode(MODE_ORDER[Number(e.key) - 1]);
    else if (e.key === 'm' || e.key === 'M') setMode(MODE_ORDER[(i + 1) % MODE_ORDER.length]);
});
setMode(mode);

function resize() {
    const w = innerWidth, h = innerHeight;
    canvas.width = w * devicePixelRatio;
    canvas.height = h * devicePixelRatio;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

function frame() {
    requestAnimationFrame(frame);
    const M = MODES[mode];
    gl.clearColor(M.bg[0] / 255, M.bg[1] / 255, M.bg[2] / 255, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    eye = eyeFromSpherical();
    const aspect = canvas.width / canvas.height;
    const proj = perspective((mesh.camera.fovDeg || 45) * Math.PI / 180, aspect, Math.max(radius * 0.01, mesh.camera.near || 0.1), (mesh.camera.far || radius * 10) + radius * 20);
    const view = lookAt(eye, target, up);
    const mvp = multiply(proj, view);

    if (M.solid !== 'none') {
        // 'depth': paint no colour, only occlusion — that is what turns the
        // edge pass below into hidden-line removal.
        if (M.solid === 'depth') gl.colorMask(false, false, false, false);
        // Push the filled triangles a hair away from the eye so the edge
        // lines that lie exactly ON them win the depth test cleanly instead
        // of stitching in and out as the part rotates.
        if (M.edges) { gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1.0, 1.0); }
        gl.useProgram(program);
        gl.uniformMatrix4fv(uMVP, false, mvp);
        gl.uniformMatrix4fv(uMV, false, view);
        gl.uniform3f(uColor, 0.30, 0.64, 0.83);
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
        gl.enableVertexAttribArray(aPosition);
        gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, normBuf);
        gl.enableVertexAttribArray(aNormal);
        gl.vertexAttribPointer(aNormal, 3, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
        if (colourRuns && M.solid === 'shade') {
            // CADSF-848: one draw per same-colour run, uColor per run — the
            // depth-only HLR pass below never paints, so it keeps one draw.
            for (const r of colourRuns) {
                const c = r.c || DEFAULT_BODY_COLOUR;
                gl.uniform3f(uColor, c[0], c[1], c[2]);
                gl.drawElements(gl.TRIANGLES, r.count, indexType, r.start * INDEX_BYTES);
            }
        } else {
            gl.drawElements(gl.TRIANGLES, mesh.indices.length, indexType, 0);
        }
        if (M.edges) gl.disable(gl.POLYGON_OFFSET_FILL);
        if (M.solid === 'depth') gl.colorMask(true, true, true, true);
    }

    if (edgeBuf && M.edges) {
        // wireframe = the same edge buffer with the depth test OFF, so the
        // far side of the part shows through. Everything else keeps it on.
        if (!M.edgeDepth) gl.disable(gl.DEPTH_TEST);
        gl.useProgram(program);
        gl.uniformMatrix4fv(uMVP, false, mvp);
        gl.uniformMatrix4fv(uMV, false, view);
        gl.uniform3f(uColor, M.edge[0], M.edge[1], M.edge[2]);
        gl.bindBuffer(gl.ARRAY_BUFFER, edgeBuf);
        gl.enableVertexAttribArray(aPosition);
        gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
        gl.disableVertexAttribArray(aNormal);
        gl.vertexAttrib3f(aNormal, 0, 0, 1);
        gl.drawArrays(gl.LINES, 0, edgeCount);
        if (!M.edgeDepth) gl.enable(gl.DEPTH_TEST);
    }
}
requestAnimationFrame(frame);
</script>
</body>
